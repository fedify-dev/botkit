min_version = "2026.6.1"

[settings]
experimental = true

[tools]
bun = "latest"
deno = "2"
node = "22"
pnpm = "latest"
"aqua:dahlia/hongdown" = "0.5.1"

[hooks]
postinstall = [
  "mise deps",
  "mise generate git-pre-commit --write --task=check",
]

[deps]
disable = ["pnpm"]

[deps.pnpm-install]
auto = true
description = "Install pnpm workspace dependencies"
sources = [
  "pnpm-workspace.yaml",
  "pnpm-lock.yaml",
  "packages/*/package.json",
  "docs/package.json",
  "examples/rss-bot/package.json",
]
outputs = ["node_modules"]
run = "pnpm install"

[deps.deno-cache]
auto = true
description = "Cache Deno workspace dependencies"
sources = [
  "deno.json",
  "deno.lock",
  "packages/*/deno.json",
  "examples/*/deno.json",
]
outputs = ["deno.lock"]
run = "deno cache packages/*/src/*.ts"

[tasks.check]
description = "Run formatting, linting, type checking, and publish checks"
depends = ["check-versions"]
run = [
  "deno check",
  "deno lint",
  "deno fmt --check",
  "hongdown --check",
  "deno publish --dry-run --allow-dirty",
]

[tasks.check-versions]
description = "Check that workspace package versions match"
raw_args = true
run = "deno run --allow-read --allow-write scripts/check_versions.ts"

[tasks.fmt]
description = "Format source and Markdown files"
run = [
  "deno fmt",
  "hongdown --write",
]

[tasks."generate:assets"]
description = "Compile the web-page CSS and fonts into src/static/*.ts"
sources = [
  "packages/botkit/scripts/build-assets.ts",
  "packages/botkit/src/css/**/*.css",
  "packages/botkit/src/fonts/*.woff2",
]
outputs = [
  "packages/botkit/src/static/style.ts",
  "packages/botkit/src/static/fonts.ts",
]
run = "deno run --allow-read --allow-write packages/botkit/scripts/build-assets.ts"

[tasks."build:botkit"]
description = "Build @fedify/botkit"
depends = ["generate:assets"]
sources = [
  "packages/botkit/deno.json",
  "packages/botkit/package.json",
  "packages/botkit/tsdown.config.ts",
  "packages/botkit/src/**/*",
]
outputs = [
  "packages/botkit/dist/mod.js",
  "packages/botkit/dist/mod.d.ts",
]
run = "pnpm --filter @fedify/botkit run build"

[tasks."build:botkit-sqlite"]
description = "Build @fedify/botkit-sqlite"
depends = ["build:botkit"]
sources = [
  "packages/botkit-sqlite/deno.json",
  "packages/botkit-sqlite/package.json",
  "packages/botkit-sqlite/tsdown.config.ts",
  "packages/botkit-sqlite/src/**/*",
]
outputs = [
  "packages/botkit-sqlite/dist/mod.js",
  "packages/botkit-sqlite/dist/mod.d.ts",
]
run = "pnpm --filter @fedify/botkit-sqlite run build"

[tasks."build:botkit-postgres"]
description = "Build @fedify/botkit-postgres"
depends = ["build:botkit"]
sources = [
  "packages/botkit-postgres/deno.json",
  "packages/botkit-postgres/package.json",
  "packages/botkit-postgres/tsdown.config.ts",
  "packages/botkit-postgres/src/**/*",
]
outputs = [
  "packages/botkit-postgres/dist/mod.js",
  "packages/botkit-postgres/dist/mod.d.ts",
]
run = "pnpm --filter @fedify/botkit-postgres run build"

[tasks."build:botkit-redis"]
description = "Build @fedify/botkit-redis"
depends = ["build:botkit"]
sources = [
  "packages/botkit-redis/deno.json",
  "packages/botkit-redis/package.json",
  "packages/botkit-redis/tsdown.config.ts",
  "packages/botkit-redis/src/**/*",
]
outputs = [
  "packages/botkit-redis/dist/mod.js",
  "packages/botkit-redis/dist/mod.d.ts",
]
run = "pnpm --filter @fedify/botkit-redis run build"

[tasks."test:node"]
description = "Build packages and run Node.js tests"
depends = ["build:*"]
run = "pnpm run -r test"

[tasks."test:deno"]
description = "Run Deno tests"
raw_args = true
run = "deno test --allow-read --allow-write --allow-env --allow-net=hollo.social,localhost,127.0.0.1 --parallel"

[tasks.test]
description = "Run all checks and tests"
depends = ["check", "test:deno", "test:node"]

[tasks.coverage]
description = "Generate Deno test coverage report"
run = [
  "deno test --allow-read --allow-write --allow-env --allow-net=hollo.social,localhost,127.0.0.1 --parallel --coverage --clean",
  "deno coverage --html",
]

[tasks."docs:dev"]
description = "Start the documentation development server"
tools.node = "24"
raw_args = true
depends = ["build:*"]
run = "pnpm --dir docs exec vitepress dev"

[tasks."docs:build"]
description = "Build the documentation site"
tools.node = "24"
depends = ["build:*"]
run = "pnpm --dir docs exec vitepress build"

[tasks."docs:preview"]
description = "Preview the built documentation site"
tools.node = "24"
raw_args = true
depends = ["build:*"]
run = "pnpm --dir docs exec vitepress preview"
