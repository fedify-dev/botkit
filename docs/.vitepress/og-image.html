<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet" />
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 1200px;
      height: 630px;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(120% 120% at 88% 12%, rgba(158, 205, 84, 0.28), transparent
        55%),
        linear-gradient(160deg, #f7f9f1 0%, #eef3e3 100%);
      font-family: "Inter", system-ui, sans-serif;
      color: #1c1d21;
    }
    .inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 80px;
      gap: 40px;
    }
    .left {
      flex: 1;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 21px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #33790f;
      margin-bottom: 26px;
    }
    .eyebrow .dot {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #398712;
      box-shadow: 0 0 0 6px rgba(57, 135, 18, 0.16);
    }
    .wordmark {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 132px;
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: #2f4d12;
    }
    .tagline {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 46px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #1c1d21;
      margin-top: 26px;
      max-width: 560px;
    }
    .sub {
      font-size: 26px;
      line-height: 1.4;
      color: #5f636c;
      margin-top: 22px;
      max-width: 520px;
    }
    .url {
      position: absolute;
      left: 80px;
      bottom: 54px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 500;
      font-size: 23px;
      letter-spacing: 0.01em;
      color: #33790f;
      z-index: 2;
    }
    .right {
      width: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kit {
      width: 420px;
      filter: drop-shadow(0 22px 44px rgba(54, 83, 20, 0.22));
    }
    .kit svg {
      width: 100%;
      height: auto;
      display: block;
    }
    </style>
  </head>
