packages:
  - packages/*
  - docs
  - examples/rss-bot

allowBuilds:
  esbuild: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@fedify/*"
  - "@jsr/fedify__*"
  - markdown-it-jsr-ref@0.5.0

# Keep the JSR dependency tree used by the docs on the 2.3 line.
overrides:
  "@jsr/fedify__fedify": ~2.3.16
  "@jsr/fedify__uri-template": ~2.3.16
  "@jsr/fedify__vocab": ~2.3.16
  "@jsr/fedify__vocab-runtime": ~2.3.16
  "@jsr/fedify__webfinger": ~2.3.16

catalog:
  "@fedify/denokv": "jsr:@fedify/denokv@~2.3.16"
  "@fedify/fedify": ~2.3.16
  "@fedify/postgres": ~2.3.16
  "@fedify/redis": ~2.3.16
  "@fedify/sqlite": ~2.3.16
  "@fedify/vocab": ~2.3.16
  "@fedify/vocab-runtime": ~2.3.16
  "@js-temporal/polyfill": ^0.5.1
  "@logtape/logtape": ^2.2.3
  hono: ^4.12.27
  tsdown: ^0.12.8
  x-forwarded-fetch: ^0.2.0
