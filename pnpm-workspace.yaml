packages:
  - packages/*
  - docs

allowBuilds:
  esbuild: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@fedify/*"
  - "@jsr/fedify__denokv@2.1.32"
  - "@jsr/fedify__fedify@2.1.32"
  - "@jsr/fedify__vocab@2.1.32"
  - "@jsr/fedify__vocab-runtime@2.1.32"
  - "@jsr/fedify__webfinger@2.1.32"

# Keep the JSR dependencies of the docs' Deno KV examples on the 2.1 line.
overrides:
  "@jsr/fedify__denokv>@jsr/fedify__fedify": ~2.1.32
  "@jsr/fedify__fedify>@jsr/fedify__vocab": ~2.1.32
  "@jsr/fedify__fedify>@jsr/fedify__vocab-runtime": ~2.1.32
  "@jsr/fedify__fedify>@jsr/fedify__webfinger": ~2.1.32
  "@jsr/fedify__vocab>@jsr/fedify__vocab-runtime": ~2.1.32
  "@jsr/fedify__vocab>@jsr/fedify__webfinger": ~2.1.32
  "@jsr/fedify__webfinger>@jsr/fedify__vocab-runtime": ~2.1.32

catalog:
  "@fedify/denokv": ~2.1.32
  "@fedify/fedify": ~2.1.32
  "@fedify/vocab": ~2.1.32
  "@fedify/vocab-runtime": ~2.1.32
  "@js-temporal/polyfill": ^0.5.1
  "@logtape/logtape": ^1.3.5
  hono: ^4.8.2
  tsdown: ^0.12.8
  x-forwarded-fetch: ^0.2.0
